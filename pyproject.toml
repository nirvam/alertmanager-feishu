[project]
name = "alertmanager-feishu"
version = "0.1.0"
description = "Alertmanager to Feishu webhook service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic-settings",
    "typer",
    "jinja2",
]

[project.scripts]
alertmanager-feishu = "alertmanager_feishu.main:cli"

[dependency-groups]
dev = [
    "pytest",
    "black",
    "isort",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alertmanager_feishu"]
